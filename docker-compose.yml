services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-reserva_sala}
      MYSQL_USER: ${DB_USER:-reserva_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-reserva_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
    ports:
      - "3306:3306"
    volumes:
      - reserva_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  reserva_mysql_data:
